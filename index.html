<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Boba Learn">
<meta name="theme-color" content="#fdf6ec">
<link rel="manifest" href="manifest.json">
<title>Boba Learn</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --cream: #fdf6ec;
  --warm:  #fff9f2;
  --sand:  #f0dfc0;
  --brown: #8b5e3c;
  --dark:  #2d1f14;
  --accent:#e8875a;
  --radius:22px;
}

html, body { height: 100%; font-family: 'Nunito', sans-serif; background: var(--cream); color: var(--dark); overflow: hidden; }

#app { display: flex; flex-direction: column; height: 100dvh; max-width: 480px; margin: 0 auto; }

/* HEADER */
.header { padding: 52px 20px 0; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
.logo { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 800; }
.logo em { color: var(--accent); font-style: normal; }
.progress-wrap { display: flex; align-items: center; gap: 8px; }
.progress-bar { width: 72px; height: 5px; background: var(--sand); border-radius: 99px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s; }
.progress-label { font-size: 12px; font-weight: 700; color: var(--brown); }

/* TABS */
.tabs { display: flex; gap: 8px; padding: 14px 20px 10px; flex-shrink: 0; }
.tab { flex: 1; padding: 10px 0; border: none; border-radius: 14px; font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 800; cursor: pointer; background: var(--sand); color: var(--brown); transition: all .2s; }
.tab.active { background: var(--dark); color: #fff; }

/* SCREENS */
.screen { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px 20px 24px; display: none; }
.screen.active { display: block; }

/* ── FLASHCARD ── */
.scene { width: 100%; height: 400px; perspective: 1200px; cursor: pointer; margin-bottom: 16px; }
.card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.4,0,.2,1); border-radius: var(--radius); }
.card.flipped { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; border-radius: var(--radius); backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px; box-shadow: 0 6px 30px rgba(0,0,0,.09); }
.face-front { background: var(--warm); }
.face-back { transform: rotateY(180deg); background: var(--warm); }

.tea-name { font-family: 'Syne', sans-serif; font-size: 30px; font-weight: 800; text-align: center; margin-bottom: 6px; }
.tea-type { font-size: 12px; font-weight: 700; color: var(--brown); opacity: .6; text-transform: uppercase; letter-spacing: 1.5px; }
.hint { font-size: 12px; color: var(--brown); opacity: .4; font-weight: 700; margin-top: 16px; }

/* Cup tag dots on front */
.front-tags { display: flex; gap: 8px; margin-top: 18px; }
.dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(0,0,0,.12); }

/* Back of card */
.back-section { width: 100%; margin-bottom: 14px; }
.back-label { font-size: 10px; font-weight: 800; color: var(--brown); opacity: .5; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 7px; }
.tag-pills { display: flex; flex-wrap: wrap; gap: 6px; }
.tag-pill {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 12px 5px 8px;
  border-radius: 99px;
  background: var(--sand);
  font-size: 12px; font-weight: 800; color: var(--dark);
}
.tag-dot { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid rgba(0,0,0,.15); flex-shrink: 0; }

.special-banner {
  width: 100%; background: #fff3cd; border: 1.5px solid #f0c040;
  border-radius: 12px; padding: 10px 14px;
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 14px;
}
.special-banner .icon { font-size: 18px; flex-shrink: 0; }
.special-banner p { font-size: 12px; font-weight: 800; color: #7a5800; line-height: 1.4; }

.brew-note { font-size: 13px; font-weight: 700; color: var(--dark); opacity: .65; text-align: center; line-height: 1.6; }

/* NAV */
.nav { display: flex; gap: 12px; margin-bottom: 10px; }
.btn { flex: 1; padding: 15px; border: none; border-radius: 16px; font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 800; cursor: pointer; transition: transform .12s; box-shadow: 0 3px 12px rgba(0,0,0,.09); }
.btn:active { transform: scale(.96); }
.btn-prev { background: var(--sand); color: var(--brown); }
.btn-next { background: var(--dark); color: #fff; }
.counter { text-align: center; font-size: 12px; color: var(--brown); font-weight: 700; opacity: .55; margin-bottom: 10px; }
.shuffle-btn { display: block; margin: 0 auto; background: none; border: 2px solid var(--sand); border-radius: 12px; padding: 8px 18px; font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700; color: var(--brown); cursor: pointer; }

/* ── QUIZ ── */
.score-bar { background: var(--warm); border-radius: 16px; padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
.score-bar span { font-size: 13px; font-weight: 700; color: var(--brown); }
.score-val { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 800; color: var(--dark); }
.q-card { background: var(--warm); border-radius: var(--radius); padding: 24px; display: flex; flex-direction: column; align-items: center; margin-bottom: 14px; box-shadow: 0 4px 20px rgba(0,0,0,.07); }
.q-dots { display: flex; gap: 8px; margin-bottom: 16px; }
.q-dot { width: 28px; height: 28px; border-radius: 50%; border: 2px solid rgba(0,0,0,.12); }
.q-text { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 800; text-align: center; line-height: 1.3; }
.options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.opt { padding: 16px 10px; border-radius: 15px; border: 2.5px solid transparent; background: var(--warm); font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700; color: var(--dark); cursor: pointer; text-align: center; box-shadow: 0 2px 10px rgba(0,0,0,.06); transition: all .15s; }
.opt:active { transform: scale(.97); }
.opt.correct { background: #d4f5e2; border-color: #3bb273; color: #1a6641; }
.opt.wrong   { background: #fde8e8; border-color: #e05c5c; color: #8b1a1a; }
.opt.reveal  { background: #d4f5e2; border-color: #3bb273; color: #1a6641; }
.feedback { text-align: center; font-size: 15px; font-weight: 700; min-height: 22px; margin-bottom: 10px; }
.feedback.ok  { color: #3bb273; }
.feedback.bad { color: #e05c5c; }
.next-btn { width: 100%; padding: 15px; border: none; border-radius: 16px; background: var(--dark); color: #fff; font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 800; cursor: pointer; display: none; box-shadow: 0 3px 12px rgba(0,0,0,.1); }
.results { display: flex; flex-direction: column; align-items: center; padding: 30px 0; }
.results-emoji { font-size: 56px; margin-bottom: 14px; }
.results-title { font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 800; margin-bottom: 6px; }
.results-score { font-family: 'Syne', sans-serif; font-size: 52px; font-weight: 800; }
.results-sub { font-size: 14px; color: var(--brown); font-weight: 700; margin-bottom: 24px; }
.results-btn { width: 100%; padding: 16px; border: none; border-radius: 16px; background: var(--dark); color: #fff; font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 800; cursor: pointer; margin-top: 10px; }

/* ── REFERENCE LIST ── */
.ref-list { display: flex; flex-direction: column; gap: 10px; }
.ref-card { background: var(--warm); border-radius: 18px; padding: 16px 18px; box-shadow: 0 3px 12px rgba(0,0,0,.07); }
.ref-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.ref-name { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 800; }
.ref-dots { display: flex; gap: 5px; }
.ref-dot { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid rgba(0,0,0,.12); }
.ref-pills { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
.ref-pill { display: flex; align-items: center; gap: 5px; padding: 3px 10px 3px 6px; border-radius: 99px; background: var(--sand); font-size: 11px; font-weight: 800; color: var(--dark); }
.ref-pill-dot { width: 10px; height: 10px; border-radius: 50%; border: 1px solid rgba(0,0,0,.15); flex-shrink: 0; }
.ref-special { display: inline-flex; align-items: center; gap: 5px; margin-top: 4px; background: #fff3cd; border-radius: 8px; padding: 4px 10px; font-size: 11px; font-weight: 800; color: #7a5800; }
.ref-note { font-size: 11px; color: var(--brown); font-weight: 700; opacity: .7; margin-top: 4px; }

/* BOTTOM NAV */
.bottom-nav { display: flex; background: var(--warm); border-top: 1.5px solid var(--sand); padding-bottom: env(safe-area-inset-bottom); flex-shrink: 0; }
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 10px 0 8px; border: none; background: none; cursor: pointer; font-family: 'Nunito', sans-serif; font-size: 10px; font-weight: 700; color: var(--brown); opacity: .4; transition: opacity .2s; gap: 3px; }
.nav-item.active { opacity: 1; color: var(--dark); }
.nav-icon { font-size: 22px; line-height: 1; }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="logo">boba<em>.</em>learn</div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="pFill"></div></div>
      <span class="progress-label" id="pLabel">0%</span>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('flash')">Flashcards</button>
    <button class="tab" onclick="switchTab('quiz')">Quiz</button>
    <button class="tab" onclick="switchTab('ref')">Reference</button>
  </div>

  <!-- FLASHCARD -->
  <div class="screen active" id="screen-flash">
    <div class="scene" id="scene" onclick="flipCard()">
      <div class="card" id="card">
        <div class="face face-front" id="front"></div>
        <div class="face face-back" id="back"></div>
      </div>
    </div>
    <div class="nav">
      <button class="btn btn-prev" onclick="prevCard()">← Prev</button>
      <button class="btn btn-next" onclick="nextCard()">Next →</button>
    </div>
    <div class="counter" id="counter"></div>
    <button class="shuffle-btn" onclick="reshuffleFlash()">🔀 Shuffle</button>
  </div>

  <!-- QUIZ -->
  <div class="screen" id="screen-quiz"></div>

  <!-- REFERENCE -->
  <div class="screen" id="screen-ref"></div>

  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('flash')" id="nav-flash"><span class="nav-icon">🃏</span>Flashcards</button>
    <button class="nav-item" onclick="switchTab('quiz')" id="nav-quiz"><span class="nav-icon">🧠</span>Quiz</button>
    <button class="nav-item" onclick="switchTab('ref')" id="nav-ref"><span class="nav-icon">📋</span>Reference</button>
  </nav>
</div>

<script>
// ── TAG COLOUR DEFINITIONS ──
// Each tag: { label, color (hex of the physical cup tag) }
const TEAS = [
  {
    name: "Green Tea",
    tags: [{ label: "Green tag", color: "#4caf50" }],
    special: false,
    note: "Place cup under dispenser and brew normally.",
  },
  {
    name: "Oolong Tea",
    tags: [{ label: "Yellow tag", color: "#f5c518" }],
    special: false,
    note: "Place cup under dispenser and brew normally.",
  },
  {
    name: "Roasted Oolong",
    tags: [{ label: "Black tag", color: "#222222" }],
    special: false,
    note: "Place cup under dispenser and brew normally.",
  },
  {
    name: "Special Roasted Oolong",
    tags: [{ label: "Black tag (tip)", color: "#222222" }],
    special: true,
    specialNote: "Press the C button when brewing.",
    note: "Tag goes on the tip of the cup.",
  },
  {
    name: "Black Tea",
    tags: [{ label: "Red tag", color: "#e53935" }],
    special: false,
    note: "Place cup under dispenser and brew normally.",
  },
  {
    name: "Hibiscus Tea",
    tags: [
      { label: "Red tag", color: "#e53935" },
      { label: "Blue tag", color: "#1e88e5" },
    ],
    special: false,
    note: "Two tags: red and blue.",
  },
  {
    name: "Rooibos Tea",
    tags: [
      { label: "Blue tag", color: "#1e88e5" },
      { label: "Blue tag", color: "#1e88e5" },
    ],
    special: false,
    note: "Two blue tags.",
  },
  {
    name: "Sun Moon Lake Tea",
    tags: [
      { label: "Yellow tag", color: "#f5c518" },
      { label: "Black tag", color: "#222222" },
    ],
    special: true,
    specialNote: "Press the C button when brewing.",
    note: "Sits next to Roasted Oolong on the machine.",
  },
  {
    name: "Alishan Oolong",
    tags: [
      { label: "Yellow tag", color: "#f5c518" },
      { label: "Blue tag", color: "#1e88e5" },
    ],
    special: true,
    specialNote: "Press the C button. Measure 7g of leaves in the cup first.",
    note: "Weigh 7 grams of leaves before brewing.",
  },
  {
    name: "Chai Tea",
    tags: [{ label: "Blue tag", color: "#1e88e5" }],
    special: false,
    note: "Place cup under dispenser and brew normally.",
  },
];

function shuffle(a) {
  const b = [...a];
  for (let i = b.length-1; i>0; i--) { const j = Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; }
  return b;
}

function setProgress(v) {
  const pct = Math.round(v*100);
  document.getElementById('pFill').style.width = pct+'%';
  document.getElementById('pLabel').textContent = pct+'%';
}

let currentTab = 'flash';
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach((el,i)=> el.classList.toggle('active', ['flash','quiz','ref'][i]===tab));
  document.querySelectorAll('.screen').forEach(el=> el.classList.remove('active'));
  document.getElementById('screen-'+tab).classList.add('active');
  document.querySelectorAll('.nav-item').forEach((el,i)=> el.classList.toggle('active', ['flash','quiz','ref'][i]===tab));
  if (tab==='quiz') initQuiz();
  if (tab==='ref') renderRef();
}

// ════════════════════
// FLASHCARD
// ════════════════════
let deck = shuffle(TEAS), cardIdx = 0, flipped = false;

function dotsHTML(tags, size=22) {
  return tags.map(t => `<div class="dot" style="width:${size}px;height:${size}px;background:${t.color}"></div>`).join('');
}

function pillsHTML(tags) {
  return tags.map(t => `
    <div class="tag-pill">
      <div class="tag-dot" style="background:${t.color}"></div>
      ${t.label}
    </div>`).join('');
}

function renderCard() {
  const t = deck[cardIdx];
  setProgress((cardIdx+1)/deck.length);
  document.getElementById('counter').textContent = `${cardIdx+1} / ${deck.length}`;
  document.getElementById('card').classList.toggle('flipped', flipped);

  // FRONT — name + tag colour dots as preview
  document.getElementById('front').innerHTML = `
    <div class="tea-name">${t.name}</div>
    <div class="front-tags">${dotsHTML(t.tags, 26)}</div>
    <div class="hint">Tap to see tag details</div>
  `;

  // BACK — tag pills, special alert, brew note
  document.getElementById('back').innerHTML = `
    ${t.special ? `
      <div class="special-banner">
        <div class="icon">⚠️</div>
        <p>${t.specialNote}</p>
      </div>` : ''}
    <div class="back-section">
      <div class="back-label">Cup Tags</div>
      <div class="tag-pills">${pillsHTML(t.tags)}</div>
    </div>
    <div class="back-section">
      <div class="back-label">Brew Note</div>
      <div class="brew-note">${t.note}</div>
    </div>
    <div class="hint" style="margin-top:8px">Tap to flip back</div>
  `;
}

function flipCard() { flipped=!flipped; renderCard(); }
function nextCard() { cardIdx=(cardIdx+1)%deck.length; flipped=false; renderCard(); }
function prevCard() { cardIdx=(cardIdx-1+deck.length)%deck.length; flipped=false; renderCard(); }
function reshuffleFlash() { deck=shuffle(TEAS); cardIdx=0; flipped=false; renderCard(); }

// ════════════════════
// QUIZ — "What tags does X use?"
// ════════════════════
let qDeck=[], qIdx=0, qScore=0, qTotal=0, qAnswered=false, qOpts=[];

function initQuiz() {
  qDeck=shuffle(TEAS); qIdx=0; qScore=0; qTotal=0; qAnswered=false;
  renderQuiz();
}

function renderQuiz() {
  const el = document.getElementById('screen-quiz');
  if (qIdx >= qDeck.length) {
    const pct = Math.round(qScore/qTotal*100);
    setProgress(1);
    el.innerHTML = `
      <div class="results">
        <div class="results-emoji">${pct===100?'🌟':pct>=70?'🎉':'💪'}</div>
        <div class="results-title">Quiz complete!</div>
        <div class="results-score">${qScore}/${qTotal}</div>
        <div class="results-sub">${pct===100?'Perfect!':pct>=70?'Great work!':'Keep practising!'}</div>
        <button class="results-btn" onclick="initQuiz()">Try Again</button>
      </div>`;
    return;
  }

  const tea = qDeck[qIdx];
  // Build 4 options: correct answer + 3 wrong teas
  const others = shuffle(TEAS.filter(t=>t.name!==tea.name)).slice(0,3);
  qOpts = shuffle([tea, ...others]);
  setProgress(qIdx/qDeck.length);

  el.innerHTML = `
    <div class="score-bar">
      <span>Score</span>
      <span class="score-val">${qScore}/${qTotal}</span>
      <span>Q${qIdx+1}/${qDeck.length}</span>
    </div>
    <div class="q-card">
      <div class="q-text">Which tea uses these tags?</div>
      <div class="q-dots" style="margin-top:16px">${dotsHTML(tea.tags, 32)}</div>
      ${tea.special ? `<div style="margin-top:8px;font-size:12px;font-weight:800;color:#7a5800;background:#fff3cd;padding:5px 12px;border-radius:8px">⚠️ Special Tea</div>` : ''}
    </div>
    <div class="options" id="opts">
      ${qOpts.map((opt,i)=>`
        <button class="opt" id="opt${i}" onclick="answer(${i})">${opt.name}</button>
      `).join('')}
    </div>
    <div class="feedback" id="qfb"></div>
    <button class="next-btn" id="qnext" onclick="nextQ()">${qIdx+1>=qDeck.length?'See results':'Next →'}</button>
  `;
}

function answer(chosen) {
  if (qAnswered) return;
  qAnswered=true; qTotal++;
  const tea = qDeck[qIdx];
  const correct = qOpts[chosen].name===tea.name;
  if (correct) qScore++;
  const correctIdx = qOpts.findIndex(o=>o.name===tea.name);
  qOpts.forEach((_,i)=>{
    const el=document.getElementById('opt'+i);
    el.style.pointerEvents='none';
    if (i===correctIdx) el.classList.add('reveal');
    else if (i===chosen) el.classList.add('wrong');
  });
  const fb=document.getElementById('qfb');
  fb.textContent = correct ? '✓ Correct!' : `✗ It was ${tea.name}`;
  fb.className='feedback '+(correct?'ok':'bad');
  document.getElementById('qnext').style.display='block';
}

function nextQ() { qIdx++; qAnswered=false; renderQuiz(); }

// ════════════════════
// REFERENCE LIST
// ════════════════════
function renderRef() {
  setProgress(1);
  document.getElementById('screen-ref').innerHTML = `
    <div class="ref-list">
      ${TEAS.map(t=>`
        <div class="ref-card">
          <div class="ref-top">
            <div class="ref-name">${t.name}</div>
            <div class="ref-dots">${t.tags.map(tag=>`<div class="ref-dot" style="background:${tag.color}"></div>`).join('')}</div>
          </div>
          <div class="ref-pills">${t.tags.map(tag=>`
            <div class="ref-pill">
              <div class="ref-pill-dot" style="background:${tag.color}"></div>
              ${tag.label}
            </div>`).join('')}
          </div>
          ${t.special ? `<div class="ref-special">⚠️ ${t.specialNote}</div>` : ''}
          ${t.note ? `<div class="ref-note">${t.note}</div>` : ''}
        </div>
      `).join('')}
    </div>
  `;
}

// ── Init ──
renderCard();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(()=>{}));
}
</script>
</body>
</html>
